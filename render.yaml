# ---------------------------------------------------------------------------
# Render Blueprint — METRASIGHT FREE-tier deployment (prototype/demo only).
# Docs: docs/deployment.md (§ Render Free) · https://render.com/docs/free
#
# One Docker web service serves the built React SPA + FastAPI API on a single
# origin (same-origin requests → no CORS needed). Render Free provides NO
# persistent disk, so SQLite, uploaded evidence and the PaddleOCR model cache
# live on the EPHEMERAL container filesystem under /tmp/metrasight — they are
# re-created (and DEMO-FOOD re-seeded through REAL OCR) on every cold start /
# redeploy. This is intentional for a $0 public prototype; see docs for the
# paid persistent-disk variant and its caveats.
#
# Render Free limits: 512 MB RAM / 0.1 CPU, spins down after ~15 min of
# inactivity, ~50s+ cold starts. The OCR memory knobs below (cpu_threads=1,
# mkldnn off) keep peak inference memory as low as the real engine allows.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: metrasight
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true # redeploy on every push to the default branch
    envVars:
      # --- Runtime shape ---------------------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      # Bind the port fast; the OCR-dependent DEMO-FOOD seed + prewarm finish
      # in a background thread (idempotent). On Free's 0.1 CPU that seed takes
      # several minutes after each cold start — the API is live meanwhile.
      - key: DEFER_HEAVY_STARTUP
        value: "true"

      # --- Filesystem (Free tier: NO persistent disk) ------------------------
      # SQLite + uploaded evidence live on the EPHEMERAL container filesystem
      # under /tmp/metrasight — re-created (and DEMO-FOOD re-seeded through
      # REAL OCR) on every cold start. The PaddleOCR model cache is the
      # exception: it is BAKED into the Docker image at /opt/paddlex-cache
      # (see Dockerfile), so cold starts never re-download ~22 MB of models —
      # with PADDLE_PDX_MODEL_SOURCE=BOS, PaddleX 3.1.0 resolves models by
      # local existence check only (verified in paddlex/utils/download.py:
      # download_and_extract skips when the model dir exists). Without this,
      # the default "huggingface" source fell back to the BOS CDN at ~3 KB/s
      # from Render's US instances and stalled the seed in OCR_PROCESSING for
      # 90+ minutes.
      - key: DATABASE_URL
        value: sqlite:////tmp/metrasight/legalmet.db
      - key: STORAGE_DIR
        value: /tmp/metrasight/storage
      - key: PADDLE_PDX_CACHE_HOME
        value: /opt/paddlex-cache
      - key: PADDLE_PDX_MODEL_SOURCE
        value: BOS

      # --- Security ----------------------------------------------------------
      # Generated once per service by Render; never committed.
      - key: SECRET_KEY
        generateValue: true

      # --- Demo data (SIH prototype — clearly-labelled demo credentials) -----
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_REGULATORY_DATA
        value: "true"
      - key: SEED_COMPLIANCE_RULES
        value: "true"
      - key: SEED_DEMO_INSPECTIONS
        value: "true"
      - key: DEMO_INSPECTION_REFS
        value: DEMO-FOOD
      - key: PERCEPTION_OCR_BACKEND
        value: paddle

      # --- Real-OCR memory tuning for the 512 MB Free instance ----------------
      # PaddleOCR stays REAL (never mocked); these only cap its footprint.
      - key: PERCEPTION_OCR_CPU_THREADS
        value: "1"
      - key: PERCEPTION_OCR_ENABLE_MKLDNN
        value: "false"
      # Detection-stage resolution cap: real OCR unchanged (verified locally —
      # identical 8 lines on the demo labels at 640 vs the 960 default), but
      # det compute drops ~2.3x — the main inference-speed knob at 0.1 CPU.
      - key: PERCEPTION_OCR_DET_LIMIT_SIDE_LEN
        value: "640"
      # Recognition batches of 1: lower peak inference memory (512 MB host)
      # at negligible speed cost for label workloads.
      - key: PERCEPTION_OCR_REC_BATCH_SIZE
        value: "1"
      # HARD OCR budget (seconds): real inference must finish within this or
      # the run fails honestly with a structured OCR_TIMEOUT error — never
      # partial or fabricated text. Requirement: <= 60 s text reading.
      - key: PERCEPTION_OCR_TIMEOUT_SECONDS
        value: "60"
